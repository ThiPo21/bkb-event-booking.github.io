{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-3 sm:px-6 py-10 sm:py-16">
    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-sky-100">
        <div class="text-center mb-6 sm:mb-8 border-b border-sky-100 pb-5">
            <div class="w-16 h-16 rounded-2xl bg-sky-50 border border-sky-100 p-2 mx-auto mb-3 shadow-2xs flex items-center justify-center">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="w-full h-full object-contain" alt="Emblem">
            </div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">เข้าสู่ระบบ</h2>
            <p class="text-xs text-slate-400 mt-1 font-normal">BKB EVENT BOOKING TOURNAMENT SYSTEM</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 font-mono">ชื่อผู้ใช้ (USERNAME):</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-3 border border-sky-200 rounded-xl focus:ring-2 focus:ring-cheero-400 text-xs sm:text-sm outline-none transition bg-sky-50/20 font-medium"
                       placeholder="กรอกชื่อผู้ใช้ของคุณ">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 font-mono">รหัสผ่าน (PASSWORD):</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 border border-sky-200 rounded-xl focus:ring-2 focus:ring-cheero-400 text-xs sm:text-sm outline-none transition bg-sky-50/20 font-medium"
                       placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cheero-500 to-sky-600 hover:from-cheero-600 hover:to-sky-700 text-white font-bold py-3.5 rounded-xl transition shadow-xs shadow-sky-200 text-xs sm:text-sm mt-3 uppercase tracking-wider cursor-pointer">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-sky-50 text-center text-xs text-slate-500">
            ยังไม่มีบัญชีใช่หรือไม่? 
            <a href="/register" class="text-cheero-600 font-bold hover:underline">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
